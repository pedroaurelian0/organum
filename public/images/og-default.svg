<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a08"/>
      <stop offset="100%" style="stop-color:#111009"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:rgba(46,145,71,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(46,145,71,0)"/>
    </radialGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grade decorativa -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Linha verde superior -->
  <rect x="80" y="80" width="120" height="3" rx="1.5" fill="#2e9147"/>

  <!-- Logo / Nome -->
  <text x="80" y="160" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Organum</text>
  <text x="80" y="200" font-family="Georgia, serif" font-size="18" fill="rgba(255,255,255,0.4)" letter-spacing="2">SEO ORGÂNICO B2B</text>

  <!-- Headline principal -->
  <text x="80" y="290" font-family="Georgia, serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-2">O SEO que gera</text>
  <text x="80" y="360" font-family="Georgia, serif" font-size="54" font-weight="900" fill="#4caf64" letter-spacing="-2" font-style="italic">pipeline — não cliques.</text>

  <!-- Subline -->
  <text x="80" y="420" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,255,255,0.5)">Do zero técnico à citação por IA. Sem anúncios.</text>

  <!-- Métricas -->
  <rect x="80" y="480" width="1040" height="1" fill="rgba(255,255,255,0.08)"/>

  <text x="80" y="550" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#4caf64">60+</text>
  <text x="80" y="575" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)" letter-spacing="1">PROJETOS</text>

  <text x="280" y="550" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#4caf64">6</text>
  <text x="280" y="575" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)" letter-spacing="1">PAÍSES</text>

  <text x="430" y="550" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#4caf64">90d</text>
  <text x="430" y="575" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)" letter-spacing="1">PARA CITAÇÃO POR IA</text>

  <!-- URL -->
  <text x="1120" y="575" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.25)" text-anchor="end">organum.com.br</text>

  <!-- Elemento decorativo direita -->
  <circle cx="1050" cy="280" r="180" fill="none" stroke="rgba(76,175,100,0.06)" stroke-width="1"/>
  <circle cx="1050" cy="280" r="130" fill="none" stroke="rgba(76,175,100,0.08)" stroke-width="1"/>
  <circle cx="1050" cy="280" r="80" fill="rgba(46,145,71,0.06)" stroke="rgba(76,175,100,0.15)" stroke-width="1"/>
  <text x="1050" y="272" font-family="Georgia, serif" font-size="32" font-weight="700" fill="rgba(76,175,100,0.6)" text-anchor="middle">5</text>
  <text x="1050" y="300" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="1">CAMADAS</text>
</svg>
